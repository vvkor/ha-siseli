name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r requirements_test.txt

      - name: Validate release metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          tag_name = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag_name):
              sys.exit(f"Unsupported tag format: {tag_name}")

          version = tag_name[1:]
          manifest = json.loads(pathlib.Path("custom_components/siseli/manifest.json").read_text())
          if manifest["version"] != version:
              sys.exit(
                  f"manifest.json version {manifest['version']} does not match release tag {version}"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if f"## [{version}]" not in changelog:
              sys.exit(f"CHANGELOG.md is missing section ## [{version}]")
          PY

      - name: Run ruff
        run: ruff check custom_components/

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q

      - name: Extract release notes
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["TAG_NAME"][1:]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          pattern = rf"## \[{re.escape(version)}\]\n(.*?)(?:\n## \[|\Z)"
          match = re.search(pattern, changelog, re.S)
          if not match:
              raise SystemExit(f"Unable to extract notes for {version}")

          notes = match.group(1).strip()
          notes = re.sub(r"\n---\s*$", "", notes).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("body<<EOF\n")
              handle.write(notes)
              handle.write("\nEOF\n")
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Siseli ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
